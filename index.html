<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Ensure fresh page loads and refreshes always start at Hero top -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
      if (window.location.hash && window.location.hash !== '#hero') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      window.addEventListener('beforeunload', function () {
        window.scrollTo(0, 0);
      });
    </script>

    <!-- Primary Page Metadata & SEO -->

    <!-- Critical Asset Preloading for Largest Contentful Paint (LCP) -->
    <link rel="preload" as="image" href="/bikes/classic-350.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />

    <!-- Critical Inline Styles for Immediate Frame-0 Paint -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #050A14;
        color: #17283D;
        overflow-x: hidden;
        font-size: 14px;
      }
      #root {
        min-height: 100vh;
        background-color: #050A14;
      }
    </style>

    <!-- Google Fonts: Non-blocking loading with display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@800;900&family=Oswald:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@800;900&family=Oswald:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700;800;900&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@800;900&family=Oswald:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=Teko:wght@700&display=swap" />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2317283d'/><circle cx='16' cy='16' r='6' fill='%23c58a28'/></svg>" />
  </head>
  <body>
    <div id="root">
      <!-- Instant Frame-0 Static Preloader: Ensures zero blank screen while initial bundles evaluate -->
      <div
        id="frame0-preloader"
        style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#050A14;background-image:radial-gradient(ellipse 80% 50% at 50% 40%, rgba(45, 78, 128, 0.22) 0%, rgba(15, 39, 71, 0.12) 50%, rgba(5, 10, 20, 0.98) 100%);user-select:none;overflow:hidden;"
      >
        <!-- Golden ambient glow -->
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%, -50%);width:min(640px, 85vw);height:min(320px, 45vh);background:radial-gradient(ellipse at center, rgba(197, 138, 40, 0.14) 0%, rgba(158, 114, 44, 0.04) 40%, transparent 70%);filter:blur(28px);pointer-events:none;"></div>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center;z-index:10;">
          <img
            src="/logo.webp"
            alt="Royal Enfield"
            style="height:44px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.7));"
          />
          <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;">
            <span style="width:40px;height:1px;background:linear-gradient(to right, transparent, rgba(158,114,44,0.8));"></span>
            <span style="font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.38em;color:#C58A28;line-height:1;white-space:nowrap;">PURE MOTORCYCLING</span>
            <span style="width:40px;height:1px;background:linear-gradient(to left, transparent, rgba(158,114,44,0.8));"></span>
          </div>
          <div style="margin-top:36px;display:flex;flex-direction:column;align-items:center;">
            <div style="width:240px;height:2px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,0.4);">
              <div id="frame0-bar" style="width:14%;height:100%;border-radius:9999px;background:linear-gradient(90deg, #9E722C 0%, #D4A862 50%, #FCCA02 100%);box-shadow:0 0 10px rgba(252,202,2,0.45);transition:width 0.25s ease;"></div>
            </div>
            <div id="frame0-txt" style="margin-top:12px;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.25em;color:#A0AEC0;">14%</div>
            <script>
              (function(){
                var b = document.getElementById('frame0-bar');
                var t = document.getElementById('frame0-txt');
                var p = 14;
                var iv = setInterval(function(){
                  if (!b || !t || !document.getElementById('frame0-preloader')) { clearInterval(iv); return; }
                  p = Math.min(84, p + Math.floor(Math.random() * 6 + 4));
                  b.style.width = p + '%';
                  t.textContent = p + '%';
                }, 90);
              })();
            </script>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
